name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Treat every compiler warning as a build failure.
  RUSTFLAGS: -D warnings

# A new push to a PR cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The crate seeks, appends and rewrites in place, and accepts both
        # path separators, so all three platforms are worth covering.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Versions
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --all-targets

      # --all-targets deliberately excludes doctests, so they run separately.
      - name: Test
        run: cargo test --all-targets

      - name: Doctests
        run: cargo test --doc

      # euc-kr is a default feature, so the fallback path needs covering too.
      - name: Test without default features
        run: cargo test --all-targets --no-default-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Proves the rust-version in Cargo.toml rather than trusting it. The
      # binding constraint is slice::as_chunks, stabilised in 1.88.
      - name: Install the declared minimum toolchain
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup default 1.88

      - name: Build
        run: cargo build --all-targets

      - name: Build without default features
        run: cargo build --all-targets --no-default-features

      - name: Test
        run: cargo test --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      # Catches broken intra-doc links, which a plain build will not.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Build documentation
        run: cargo doc --no-deps --document-private-items
